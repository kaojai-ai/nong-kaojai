name: Build and release pet

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nong-kaojai-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate pet manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pet_dir = Path("codex-pet")
          manifest = json.loads((pet_dir / "pet.json").read_text())
          version = (pet_dir / "VERSION").read_text().strip()
          assert manifest["id"] == "nong-kaojai"
          assert manifest["spriteVersionNumber"] == 2
          assert manifest["spritesheetPath"] == "spritesheet.webp"
          assert (pet_dir / manifest["spritesheetPath"]).is_file()
          assert len(version.split(".")) == 3
          assert all(part.isdigit() for part in version.split("."))
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          PY

      - name: Build release archive
        run: ./codex-pet/scripts/build.sh

      - name: Verify archive contents
        run: |
          version=$(cat codex-pet/VERSION)
          archive="codex-pet/dist/nong-kaojai-v${version}.zip"
          unzip -Z1 "$archive" | sort
          test "$(unzip -Z1 "$archive" | wc -l | tr -d ' ')" = "3"

      - name: Create versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat codex-pet/VERSION)
          release_asset="codex-pet/dist/nong-kaojai-v${version}.zip"
          gh release create "$GITHUB_REF_NAME" \
            "$release_asset#N'KaoJai $GITHUB_REF_NAME pet package" \
            --target "$GITHUB_SHA" \
            --title "N'KaoJai $GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
